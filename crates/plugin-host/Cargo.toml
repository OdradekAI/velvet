[package]
name = "velvet-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crc32fast = "1"
ed25519-dalek = "2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
velvet-layout-model = { path = "../layout-model" }
velvet-job-system = { path = "../job-system" }
velvet-persistence = { path = "../persistence" }
velvet-plugin-api = { path = "../plugin-api" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
