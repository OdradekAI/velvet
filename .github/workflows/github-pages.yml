name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json

      - name: Install documentation dependencies
        working-directory: apps/docs
        run: npm ci

      - name: Install desktop UI dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build all documentation locales
        working-directory: apps/docs
        env:
          DOCS_DEPLOY_TARGET: github-pages
          DOCS_SITE_URL: https://odradekai.github.io
          DOCS_BASE_URL: /velvet/
        run: npm run verify:release

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/docs/build

  deploy:
    name: Deploy documentation site
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
