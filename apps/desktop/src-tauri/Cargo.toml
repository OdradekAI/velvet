[package]
name = "velvet-desktop"
version = "0.0.4"
edition = "2021"
license = "Apache-2.0"
build = "build.rs"

[workspace]

[[bin]]
name = "velvet-launcher"
path = "src/launcher.rs"

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.9.5", features = ["unstable"] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-global-shortcut = "2.4.1"
velvet-asset-core = { path = "../../../crates/asset-core" }
velvet-application-core = { path = "../../../crates/application-core" }
velvet-job-system = { path = "../../../crates/job-system" }
velvet-layout-model = { path = "../../../crates/layout-model" }
velvet-persistence = { path = "../../../crates/persistence" }
velvet-plugin-api = { path = "../../../crates/plugin-api" }
velvet-plugin-host = { path = "../../../crates/plugin-host" }
velvet-preview-core = { path = "../../../crates/preview-core" }
velvet-tauri-adapter = { path = "../../../crates/tauri-adapter" }
velvet-workbench-protocol = { path = "../../../crates/workbench-protocol" }

[dev-dependencies]
serde_json = "1"
